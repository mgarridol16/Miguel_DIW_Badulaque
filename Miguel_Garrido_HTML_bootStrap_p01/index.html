<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de MACs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<body class="bg-light">

    <header class="bg-primary text-white text-center py-3 shadow-sm mb-4">
        <h2>REGISTRO MACs IES GREGORIO PRIETO</h2>
    </header>

    <main class="container">
        <form class="bg-white p-4 rounded shadow mx-auto">
            <div class="mb-3">
                <label for="nombre" class="form-label">Introduce tu nombre</label>
                <input type="text" id="nombre" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="clase" class="form-label">Selecciona la clase</label>
                <select id="clase" class="form-select">
                    <option selected disabled>Clase</option>
                    <option>1-DAW</option>
                    <option>1-DAM</option>
                    <option>2-DAW</option>
                    <option>2-DAM</option>
                </select>
            </div>

            <fieldset class="mb-3">
                <legend class="col-form-label pt-0">Selecciona tu rol</legend>
                <div class="form-check">
                    <input type="radio" id="alumno" name="rol" class="form-check-input">
                    <label class="form-check-label" for="alumno">Alumno</label>
                </div>
                <div class="form-check">
                    <input type="radio" id="profesor" name="rol" class="form-check-input">
                    <label class="form-check-label" for="profesor">Profesor</label>
                </div>
            </fieldset>

            <div class="mb-3">
                <label for="mac" class="form-label">Introduce tu MAC</label>
                <input type="text" id="mac" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Enviar</button>
        </form>
    </main>

    <hr class="border border-primary border-3 opacity-75">

    <section class="container">
        <h1 class="display-5 text-center">MACs Introducidas</h1>
