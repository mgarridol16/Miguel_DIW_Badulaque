<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de MACs</title>
    <link rel="stylesheet" href="estilos.css">
  </head>
  <body> 
    <header> 
      <h1>REGISTRO MACs IES GREGORIO PRIETO </h1>
    </header>
    <main> 
      <form action="">
        <fieldset>
          <legend>Datos de la persona</legend>
          <label for="name">Introduce tu nombre: </label>
          <input id="name" type="text" name="name">
          <label for="clases">Selecciona la clase</label>
          <select id="clases" name="clase">
            <option disabled selected>clase</option>
            <option value="1-DAW">1-DAW</option> 
            <option value="1-DAM">1-DAM</option>
            <option value="2-DAW">2-DAW</option>
            <option value="2-DAM">2-DAM </option>
          </select>
        </fieldset>
        <fieldset>
          <legend>Rol</legend>
          <label for="alumno">
            <input id="alumno" type="radio" name="rol">Alumno
          </label>
          <label for="profesor">
            <input id="profesor" type="radio" name="rol">Profesor
          </label>
        </fieldset>
        <fieldset>
          <legend>Dirección MAC</legend>
          <label for="macs">Introduce tu MAC: </label>
          <input id="macs" type="text" name="macs">
          <input type="button" value="Enviar">
        </fieldset>
      </form>
    </main>
    <footer>
      <section class="mac-lista">
        <h2>MACs Introducidas</h2>
        <article class="registro">
          <p>09:04:4D:31:A4</p>
          <input type="button" value="editar">
          <input type="button" value="borrar">
        </article>

          <p>09:04:4D:31:A4</p>
          <input type="button" value="editar">
          <input type="button" value="borrar">
        </article>
      </section>
    </footer>
  </body>
</html>
